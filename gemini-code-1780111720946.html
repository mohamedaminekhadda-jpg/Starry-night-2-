<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gifshot/0.3.2/gifshot.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Well: Master Smart Mirror OS (Final Physics)</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --panel-bg: #141416;
            --mirror-off: #030305;
            --pcb-color: #0b3f19;
            --copper: #d4a373;
            --accent: #8a2be2;
        }

        body {
            background-color: var(--bg-color);
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            display: flex;
            gap: 30px;
            background: var(--panel-bg);
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            flex-wrap: wrap; 
            justify-content: center;
        }

        /* --- LEFT SIDE: CONTROLS & INFO --- */
        .control-panel {
            width: 330px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 85vh;
            overflow-y: auto;
            padding-right: 5px;
        }
        .control-panel::-webkit-scrollbar { width: 5px; }
        .control-panel::-webkit-scrollbar-thumb { background: #444; border-radius: 5px; }

        .box { background: #1c1c1e; padding: 12px 18px; border-radius: 10px; border: 1px solid #2a2a2d; }
        .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: #888; margin-bottom: 10px; margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 5px; }

        /* Hardware Panel */
        .hardware-box { display: flex; align-items: center; gap: 15px; background: #111; padding: 10px; border-radius: 8px; border-left: 3px solid #00ff00; transition: border-color 0.3s; }
        .esp32 { width: 45px; height: 65px; background: var(--pcb-color); border: 1.5px solid var(--copper); border-radius: 4px; position: relative; display: flex; justify-content: center; align-items: center; flex-shrink: 0; }
        .status-led { width: 6px; height: 6px; background: #444; border-radius: 50%; position: absolute; top: 5px; right: 5px; transition: background 0.3s; }
        .status-led.running { background: #00ff00; box-shadow: 0 0 8px #00ff00; }
        .status-led.standby { background: #ffcc00; box-shadow: 0 0 8px #ffcc00; }
        .hw-labels { font-size: 11px; color: #aaa; line-height: 1.4; }
        .active-hw-list { color: #00ffff; font-weight: bold; margin-top: 4px; display: block;}

        /* Modifiers & Settings */
        .modifier-group { display: flex; flex-wrap: wrap; gap: 6px; }
        .toggle-btn { flex: 1 1 45%; background: #252525; color: #aaa; border: 1px solid #444; padding: 8px 6px; font-size: 11px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.3s; text-align: center; }
        .toggle-btn:hover { border-color: var(--accent); color: white; }
        .toggle-btn.active { background: var(--accent); color: #fff; border-color: #b366ff; box-shadow: 0 0 10px rgba(138,43,226,0.4); }
        .toggle-btn#btnTwinkle.active { background: #143240; border-color: #245c73; box-shadow: 0 0 10px rgba(0,255,204,0.4); }
        .toggle-btn#btnSpectral.active { background: #2c1a4d; border-color: #5c3aa6; }
        .toggle-btn#btnCamera.active { background: #00ffcc; border-color: #00ffcc; color: #000; box-shadow: 0 0 10px rgba(0,255,204,0.4); }
        .toggle-btn#btnMic.active { background: #ff0055; border-color: #ff0055; box-shadow: 0 0 10px rgba(255,0,85,0.4); }

        .slider-container { margin-top: 10px; background: #111; padding: 10px; border-radius: 6px; border: 1px solid #333; display: flex; flex-direction: column; gap: 10px;}
        .slider-row { display: flex; flex-direction: column; gap: 5px; }
        .slider-label { display: flex; justify-content: space-between; font-size: 10px; color: #00ffcc; text-transform: uppercase; font-weight: bold; }
        .slider-label.alt { color: #ffcc00; }
        input[type=range] { width: 100%; cursor: pointer; accent-color: #00ffcc; }
        input.alt-range[type=range] { accent-color: #ffcc00; }

        .action-btn { width: 100%; background: #333; color: #fff; border: 1px solid #555; padding: 8px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 11px; margin-top: 6px; transition: 0.2s; }
        .action-btn:hover { background: #444; }

        /* Tracing Engine Radio Buttons */
        .radio-group label { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #ccc; cursor: pointer; padding: 3px 0; transition: color 0.2s; }
        .radio-group label:hover { color: #fff; }
        .radio-group input[type="radio"] { accent-color: var(--accent); }

        /* Mode Selection */
        .mode-group { display: flex; flex-direction: column; gap: 5px; }
        .btn-mode { background: #222; color: #aaa; border: 1px solid #333; padding: 8px 12px; font-size: 11px; font-weight: 600; border-radius: 6px; cursor: pointer; text-align: left; transition: all 0.2s ease; display: flex; justify-content: space-between; align-items: center; }
        .btn-mode:hover { border-color: #666; color: #fff; }
        .btn-mode.active { background: #0056b3; border-color: #007bff; color: #fff; box-shadow: 0 0 10px rgba(0, 123, 255, 0.4); }

        /* Specific Interactive Buttons */
        .btn-interactive { background: #2d2417; border-color: #4a3a24; }
        .btn-constellation { background: #1a1a1a; color: #888; border: 1px solid #333; padding: 6px; border-radius: 4px; font-size: 10px; cursor: pointer; display: flex; justify-content: space-between; margin-top: 4px;}
        .btn-constellation.active { background: #333; color: #fff; border-color: var(--accent); }

        .info-panel { font-size: 11px; color: #bbb; line-height: 1.5; background: #151515; padding: 12px; border-radius: 8px; border-left: 4px solid #444; transition: border-color 0.3s; margin-top: 10px;}

        /* --- RIGHT SIDE: MIRROR FRAME --- */
        .mirror-frame {
            width: 420px; height: 600px; background: var(--mirror-off); border: 10px solid #111;
            border-top-left-radius: 210px; border-top-right-radius: 210px; position: relative;
            overflow: hidden; box-shadow: inset 0 0 50px rgba(0,0,0,0.95), 0 25px 60px rgba(0,0,0,0.9);
            transition: background 0.5s ease; cursor: default; touch-action: none; 
        }
        .mirror-frame.interactive { cursor: crosshair; }

        /* Camera Layer */
        #webcamFeed { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: 0; z-index: 1; transition: opacity 1.2s ease; pointer-events: none; }
        .mirror-frame.global-camera #webcamFeed { opacity: 0.4; }
        .mirror-frame.global-camera.camera-standby #webcamFeed { opacity: 0 !important; }

        /* PIR Motion Overlay */
        .person { position: absolute; bottom: -50px; left: -200px; width: 140px; height: 350px; background: rgba(0, 0, 0, 0.85); border-radius: 70px 70px 0 0; filter: blur(15px); z-index: 25; pointer-events: none; }
        @keyframes walkPass { 0% { left: -200px; } 100% { left: 500px; } }

        /* Glass Reflection Gradient */
        .mirror-frame::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(140deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0) 60%); pointer-events: none; z-index: 30; }

        /* Nebula UV Layer */
        .nebula-glow { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 40% 50%, rgba(138, 43, 226, 0.35), transparent 60%), radial-gradient(circle at 70% 30%, rgba(0, 255, 255, 0.2), transparent 50%), radial-gradient(circle at 20% 70%, rgba(255, 0, 128, 0.15), transparent 40%); filter: blur(25px); mix-blend-mode: screen; opacity: 0; z-index: 2; transition: opacity 1.5s ease-in-out; }
        .mirror-frame.mode-nebula .nebula-glow { opacity: 1; animation: nebulaPulse 8s infinite alternate ease-in-out; }
        @keyframes nebulaPulse { 0% { transform: scale(1); opacity: 0.7; } 100% { transform: scale(1.1); opacity: 0.9; } }

        /* --- SVG STAR MAP ENGINE --- */
        #svgCanvas { 
            width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 5; pointer-events: none;
            transition: opacity 0.3s ease; 
        }

        line { stroke: rgba(255, 255, 255, 0); stroke-width: 1.2; stroke-dasharray: 3 4; transition: stroke 0.6s ease; }
        text { fill: rgba(255, 255, 255, 0); font-family: 'Times New Roman', Times, serif; font-style: italic; font-size: 13px; letter-spacing: 1px; transition: fill 0.8s ease; pointer-events: none; }
        
        .major-star { fill: rgba(255, 255, 255, 0.12); transition: fill 0.4s ease, filter 0.4s ease, r 0.2s ease, opacity 0.2s ease; }
        .bg-star { fill: rgba(255, 255, 255, 0.1); opacity: 0; transition: opacity 1s ease, r 0.2s ease; }

        /* Mic Fix: Strip transitions */
        .mirror-frame.global-audio .major-star, .mirror-frame.global-audio .bg-star { transition: none !important; }

        /* Standard Tracing Active States */
        g.active-stars .major-star, .major-star.active-single-star { fill: #ffffff; filter: drop-shadow(0 0 4px rgba(255,255,255,0.8)); }
        g.active-lines line { stroke: rgba(255, 255, 255, 0.45); }
        g.active-lines text { fill: rgba(255, 255, 255, 0.75); }

        /* Global Modifier: Background Twinkle (Only affects BG dust now!) */
        .mirror-frame.global-twinkle .bg-star { opacity: 1; animation: cosmicTwinkle var(--duration) infinite ease-in-out; animation-delay: var(--delay); }
        @keyframes cosmicTwinkle { 0%, 100% { opacity: 0.12; } 50% { opacity: 0.8; filter: drop-shadow(0 0 2px rgba(255,255,255,0.4)); } }

        /* Global Modifier: Spectral Colors (OVERRIDES RGB) */
        .mirror-frame.global-spectral g.active-stars .major-star.type-O, .mirror-frame.global-spectral .major-star.active-single-star.type-O, .mirror-frame.global-spectral.mode-rgb .major-star.type-O { fill: #9bb0ff !important; filter: drop-shadow(0 0 5px #9bb0ff) !important; animation: none !important;}
        .mirror-frame.global-spectral g.active-stars .major-star.type-B, .mirror-frame.global-spectral .major-star.active-single-star.type-B, .mirror-frame.global-spectral.mode-rgb .major-star.type-B { fill: #aabfff !important; filter: drop-shadow(0 0 5px #aabfff) !important; animation: none !important;}
        .mirror-frame.global-spectral g.active-stars .major-star.type-A, .mirror-frame.global-spectral .major-star.active-single-star.type-A, .mirror-frame.global-spectral.mode-rgb .major-star.type-A { fill: #cad7ff !important; filter: drop-shadow(0 0 4px #cad7ff) !important; animation: none !important;}
        .mirror-frame.global-spectral g.active-stars .major-star.type-F, .mirror-frame.global-spectral .major-star.active-single-star.type-F, .mirror-frame.global-spectral.mode-rgb .major-star.type-F { fill: #f8f7ff !important; filter: drop-shadow(0 0 4px #f8f7ff) !important; animation: none !important;}
        .mirror-frame.global-spectral g.active-stars .major-star.type-G, .mirror-frame.global-spectral .major-star.active-single-star.type-G, .mirror-frame.global-spectral.mode-rgb .major-star.type-G { fill: #fff4e8 !important; filter: drop-shadow(0 0 4px #fff4e8) !important; animation: none !important;}
        .mirror-frame.global-spectral g.active-stars .major-star.type-K, .mirror-frame.global-spectral .major-star.active-single-star.type-K, .mirror-frame.global-spectral.mode-rgb .major-star.type-K { fill: #ffce99 !important; filter: drop-shadow(0 0 5px #ffce99) !important; animation: none !important;}
        .mirror-frame.global-spectral g.active-stars .major-star.type-M, .mirror-frame.global-spectral .major-star.active-single-star.type-M, .mirror-frame.global-spectral.mode-rgb .major-star.type-M { fill: #ff9664 !important; filter: drop-shadow(0 0 6px #ff9664) !important; animation: none !important;}

        /* --- Firmware Hardware Simulation Overrides --- */
        .mirror-frame.mode-rgb .major-star { animation: svgRgbCycle 6s infinite alternate; }
        @keyframes svgRgbCycle { 
            0% { fill: #b3ffff; filter: drop-shadow(0 0 6px #b3ffff); }
            33% { fill: #ffb3ff; filter: drop-shadow(0 0 6px #ffb3ff); }
            66% { fill: #ffffb3; filter: drop-shadow(0 0 6px #ffffb3); }
            100% { fill: #b3ffcc; filter: drop-shadow(0 0 6px #b3ffcc); }
        }

        .dance-active { fill: #ffffff !important; filter: drop-shadow(0 0 8px #fff) !important; r: 3.5 !important; }
        .mirror-frame.mode-breathe .major-star { animation: svgBreathe 6s infinite ease-in-out; }
        @keyframes svgBreathe { 0%, 100% { fill: rgba(255,255,255,0.1); } 50% { fill: rgba(255,255,255,0.7); filter: drop-shadow(0 0 5px #fff); r: 3; } }

        /* PIEZO PHYSICS: SPLIT FOR MAJOR VS BG STARS TO PREVENT BLOWOUT */
        
        /* 1. Kinetic Wave */
        .major-star.wave-hit { animation: svgWave 0.6s ease-out forwards !important; }
        .bg-star.wave-hit { animation: svgWaveBg 0.6s ease-out forwards !important; }

        @keyframes svgWave { 
            0% { fill: #00ffff; stroke: #00ffff; stroke-width: 8px; opacity: 1; } 
            100% { fill: rgba(255,255,255,0.12); stroke: rgba(0,255,255,0); stroke-width: 0px; } 
        }
        @keyframes svgWaveBg { 
            0% { fill: #00ffff; stroke: #00ffff; stroke-width: 2px; opacity: 1; } 
            100% { fill: rgba(255,255,255,0.12); stroke: rgba(0,255,255,0); stroke-width: 0px; } 
        }

        /* 2. Impact Shock */
        .major-star.shock-hit { animation: svgShock 0.4s infinite alternate forwards !important; }
        .bg-star.shock-hit { animation: svgShockBg 0.4s infinite alternate forwards !important; }

        @keyframes svgShock {
            0% { fill: #fff; stroke: #fff; stroke-width: 6px; opacity: 1; }
            50% { fill: #ffcc00; stroke: #ffcc00; stroke-width: 3px; opacity: 1; }
            100% { fill: rgba(255,255,255,0.12); stroke-width: 0px; }
        }
        @keyframes svgShockBg {
            0% { fill: #fff; stroke: #fff; stroke-width: 1.5px; opacity: 1; }
            50% { fill: #ffcc00; stroke: #ffcc00; stroke-width: 1px; opacity: 1; }
            100% { fill: rgba(255,255,255,0.12); stroke-width: 0px; }
        }

    </style>
</head>
<body>

<div class="container">
    
    <div class="control-panel">
        
        <div class="box">
            <h3 class="section-title">System Bus</h3>
            <div class="hardware-box" id="hwContainer">
                <div class="esp32">
                    <div class="status-led" id="espLed"></div>
                    <div style="font-size:10px; color:#888; font-weight:bold;">ESP32</div>
                </div>
                <div class="hw-labels">
                    <strong style="color:#fff;">Active Sensors:</strong><br>
                    <span id="hwList" class="active-hw-list">ESP32 Core (Sleep)</span>
                </div>
            </div>
        </div>

        <div class="box">
            <h3 class="section-title">Hardware Modifiers</h3>
            <div class="modifier-group">
                <button class="toggle-btn" id="btnTwinkle" onclick="toggleTwinkle()">🌌 Twinkle</button>
                <button class="toggle-btn" id="btnSpectral" onclick="toggleSpectral()">✨ Star Colors</button>
                <button class="toggle-btn" id="btnCamera" onclick="toggleCamera()">📷 Smart Mirror</button>
                <button class="toggle-btn" id="btnMic" onclick="toggleAudio()">🎙️ I2S Mic</button>
            </div>
            
            <div class="slider-container">
                <div class="slider-row" id="cameraControls" style="display:none; margin-bottom: 8px;">
                    <div class="slider-label"><span>Glass VLT Density</span><span id="brightnessVal">40%</span></div>
                    <input type="range" id="camBrightness" min="0.1" max="1.0" step="0.05" value="0.4" oninput="updateCameraOpacity(this.value)">
                </div>
                
                <div class="slider-row">
                    <div class="slider-label alt"><span>LED Master PWM</span><span id="ledLumVal">100%</span></div>
                    <input type="range" class="alt-range" id="ledBrightness" min="0.1" max="1.0" step="0.05" value="1.0" oninput="updateLedBrightness(this.value)">
                </div>
            </div>

            <div style="display: flex; gap: 5px; margin-top: 10px;">
                <button class="action-btn" onclick="takeSnapshot()">📸 Snapshot</button>
                <button class="action-btn" id="btnRecord" onclick="recordGIF()" style="background:#8a2be2; border-color:#6a1bb2;">🔴 Record GIF</button>
            </div>
        </div>

        <div class="box" id="tracingBox" style="display:none; border-color: #007bff;">
            <h3 class="section-title">Tracing Engine Logic</h3>
            <div class="radio-group" id="tracing-modes">
                <label><input type="radio" name="trace" value="instant" checked> ⚡ Instant Snap</label>
                <label><input type="radio" name="trace" value="sequential"> 🪄 Stars, then Lines</label>
                <label><input type="radio" name="trace" value="path"> 🛰️ Star by Star (Path)</label>
            </div>
            
            <button class="action-btn" onclick="toggleAllTracing()" style="margin-top: 10px; background: #2c1a4d; border-color: #5c3aa6;">✨ Toggle All Constellations</button>

            <div id="constellation-buttons" style="margin-top: 10px; border-top: 1px solid #333; padding-top: 5px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px;">
                <button class="btn-constellation" onclick="toggleGroup('cassiopeia')" id="btn-cassiopeia">Cassiopeia <span>+</span></button>
                <button class="btn-constellation" onclick="toggleGroup('ursa-major')" id="btn-ursa-major">Ursa Major <span>+</span></button>
                <button class="btn-constellation" onclick="toggleGroup('draco')" id="btn-draco">Draco <span>+</span></button>
                <button class="btn-constellation" onclick="toggleGroup('cygnus')" id="btn-cygnus">Cygnus <span>+</span></button>
                <button class="btn-constellation" onclick="toggleGroup('lyra')" id="btn-lyra">Lyra <span>+</span></button>
                <button class="btn-constellation" onclick="toggleGroup('ursa-minor')" id="btn-ursa-minor">Polaris <span>+</span></button>
                <button class="btn-constellation" onclick="toggleGroup('orion')" id="btn-orion">Orion <span>+</span></button>
                <button class="btn-constellation" onclick="toggleGroup('leo')" id="btn-leo">Leo <span>+</span></button>
                <button class="btn-constellation" onclick="toggleGroup('scorpius')" id="btn-scorpius" style="grid-column: span 2;">Scorpius <span>+</span></button>
            </div>
        </div>

        <div class="box">
            <h3 class="section-title">Firmware Modes</h3>
            <div class="mode-group">
                <button class="btn-mode" id="btn0" onclick="switchMode(0)"><span>0. Power Down</span><span>⚫</span></button>
                <button class="btn-mode" id="btn1" onclick="switchMode(1)"><span>1. RGB Hardware Test</span><span>🌈</span></button>
                <button class="btn-mode" id="btn2" onclick="switchMode(2)"><span>2. Interactive Tracing</span><span>📐</span></button>
                <button class="btn-mode" id="btn3" onclick="switchMode(3)"><span>3. Random Matrix Shift</span><span>⚡</span></button>
                <button class="btn-mode" id="btn4" onclick="switchMode(4)"><span>4. PIR Motion Sensor</span><span>🚶</span></button>
                <button class="btn-mode" id="btn5" onclick="switchMode(5)"><span>5. Zodiac Auto-Cycle</span><span>📅</span></button>
                <button class="btn-mode" id="btn6" onclick="switchMode(6)"><span>6. Sleep Breathing</span><span>🧘</span></button>
                <button class="btn-mode" id="btn7" onclick="switchMode(7)"><span>7. UV Nebula Dust</span><span>🌌</span></button>
                <button class="btn-mode btn-interactive" id="btn8" onclick="switchMode(8)"><span>8. Kinetic Wave (Tap)</span><span>💧</span></button>
                <button class="btn-mode btn-interactive" id="btn9" onclick="switchMode(9)"><span>9. Impact Shock (Tap)</span><span>💥</span></button>
            </div>
        </div>

        <div class="info-panel" id="infoPanel">System Offline.</div>
    </div>

    <div class="mirror-frame" id="mirrorFrame">
        <video id="webcamFeed" autoplay playsinline muted></video>
        <div class="nebula-glow"></div>
        <div class="person" id="personShadow"></div>
        
        <svg id="svgCanvas" viewBox="0 0 420 600" xmlns="http://www.w3.org/2000/svg">
            <g id="milky-way-void"></g>

            <g id="cassiopeia">
                <line x1="80" y1="120" x2="65" y2="100"/><line x1="65" y1="100" x2="100" y2="70"/><line x1="100" y1="70" x2="130" y2="90"/><line x1="130" y1="90" x2="180" y2="55"/>
                <circle cx="80" cy="120" r="2.5" class="major-star type-B" /><circle cx="65" cy="100" r="2.5" class="major-star type-A" /><circle cx="100" cy="70" r="3" class="major-star type-K" /><circle cx="130" cy="90" r="2.5" class="major-star type-B" /><circle cx="180" cy="55" r="2.5" class="major-star type-A" />
                <text x="100" y="110">Cassiopeia</text>
            </g>

            <g id="ursa-major">
                <line x1="350" y1="160" x2="330" y2="140"/><line x1="330" y1="140" x2="280" y2="130"/><line x1="280" y1="130" x2="250" y2="90"/><line x1="250" y1="90" x2="200" y2="70"/><line x1="200" y1="70" x2="205" y2="105"/><line x1="205" y1="105" x2="240" y2="120"/><line x1="240" y1="120" x2="250" y2="90"/>
                <circle cx="350" cy="160" r="2.5" class="major-star type-B" /><circle cx="330" cy="140" r="3" class="major-star type-A" /><circle cx="280" cy="130" r="2.5" class="major-star type-A" /><circle cx="250" cy="90" r="2.5" class="major-star type-A" /><circle cx="200" cy="70" r="3" class="major-star type-K" /><circle cx="205" cy="105" r="2.5" class="major-star type-A" /><circle cx="240" cy="120" r="2.5" class="major-star type-A" />
                <text x="240" y="60">Ursa Major</text>
            </g>

            <g id="draco">
                <line x1="140" y1="240" x2="155" y2="210"/><line x1="155" y1="210" x2="190" y2="220"/><line x1="190" y1="220" x2="240" y2="210"/><line x1="240" y1="210" x2="270" y2="205"/><line x1="270" y1="205" x2="285" y2="215"/><line x1="285" y1="215" x2="290" y2="195"/><line x1="290" y1="195" x2="265" y2="190"/><line x1="265" y1="190" x2="270" y2="205"/>

<script>
    // System Variables
    let currentMode = 0;
    let isTwinkleOn = false; let isSpectralOn = false; let isAudioOn = false; let isCameraOn = false;
    let activeTimers = {}; let danceInterval = null; let motionTimeout = null; let autoCycleInterval = null;
    let audioCtx, analyser, dataArray, audioSource, audioAnimId; let videoStream = null;

    const constellations = ['cassiopeia', 'ursa-major', 'draco', 'cygnus', 'lyra', 'ursa-minor', 'orion', 'leo', 'scorpius'];
    
    const frame = document.getElementById('mirrorFrame');
    const svgLayer = document.getElementById('svgCanvas'); 
    const espLed = document.getElementById('espLed');
    const hwList = document.getElementById('hwList');
    const hwContainer = document.getElementById('hwContainer');
    const infoPanel = document.getElementById('infoPanel');
    const shadow = document.getElementById('personShadow');
    const tracingBox = document.getElementById('tracingBox');
    const videoElement = document.getElementById('webcamFeed');
    const camSlider = document.getElementById('cameraControls');
    const sliderInput = document.getElementById('camBrightness');

    const descriptions = {
        0: "<strong>Mode 0: Deep Sleep</strong><br><br>Powering down all matrices.",
        1: "<strong>Mode 1: RGB Hardware Test</strong><br><br>Cycles core nodes through PASTEL RGB spectrum.",
        2: "<strong>Mode 2: Tracing Engine</strong><br><br>Unlocks the manual constellation controls.",
        3: "<strong>Mode 3: Matrix Shift</strong><br><br>Aggressive data-line shifts to test power draw.",
        4: "<strong>Mode 4: PIR Motion Trigger</strong><br><br>Mirror is dark. Shadow triggers passive ambient breathing.",
        5: "<strong>Mode 5: Zodiac Auto-Cycle</strong><br><br>Automatically sequences through the star map.",
        6: "<strong>Mode 6: Sleep Breathing</strong><br><br>Slow PWM sine-wave fade on all nodes.",
        7: "<strong>Mode 7: UV Nebula Dust</strong><br><br>Triggers 365nm side-grazing LEDs.",
        8: "<strong>Mode 8: Kinetic Wave</strong><br><br><strong>TAP THE GLASS.</strong> Piezo ripples light outward.",
        9: "<strong>Mode 9: Impact Shock</strong><br><br><strong>TAP THE GLASS.</strong> Hard impact flickers LEDs."
    };

    window.onload = function() {
        const voidContainer = document.getElementById('milky-way-void');
        for (let i = 0; i < 250; i++) {
            const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            let x = Math.random() * 420; let y = Math.random() * 600;
            let r = 0.4 + Math.random() * 0.8; 
            let delay = (Math.random() * 5) + "s";
            let duration = (2 + Math.random() * 4) + "s";
            circle.setAttribute("cx", x); circle.setAttribute("cy", y); circle.setAttribute("r", r);
            circle.setAttribute("class", "bg-star");
            circle.setAttribute("data-orig-r", r); 
            circle.style.setProperty("--delay", delay); circle.style.setProperty("--duration", duration);
            voidContainer.appendChild(circle);
        }
        
        document.querySelectorAll('.major-star').forEach(star => {
            star.setAttribute('data-orig-r', star.getAttribute('r'));
            star.style.animationDelay = `-${Math.random() * 6}s`; 
        });

        switchMode(0);
        frame.addEventListener('mousedown', handleMirrorClick);
        frame.addEventListener('touchstart', handleMirrorTouch, {passive: false});
    };

    function updateHardwareList() {
        let hw = [];
        if (currentMode === 0) { hw.push("ESP32 (Deep Sleep)"); hwContainer.style.borderLeftColor = "#444"; } 
        else { hw.push("ESP32 Core (Active)"); hw.push("SK6812 LED Matrix"); hwContainer.style.borderLeftColor = "#00ff00"; }
        if (currentMode === 4) hw.push("PIR Motion Sensor");
        if (currentMode === 7) hw.push("365nm UV Edge-Lit");
        if (currentMode === 8 || currentMode === 9) hw.push("Piezo Sensors (x4)");
        if (isAudioOn) { hw.push("INMP441 I2S Mic"); hwContainer.style.borderLeftColor = "#ff0055"; }
        if (isCameraOn) { hw.push("Mirror Lens"); }
        hwList.innerHTML = hw.join("<br>+ ");
    }

    function updateLedBrightness(val) {
        svgLayer.style.opacity = val;
        document.getElementById('ledLumVal').innerText = Math.round(val * 100) + "%";
    }

    function toggleTwinkle() {
        isTwinkleOn = !isTwinkleOn;
        document.getElementById('btnTwinkle').classList.toggle('active');
        frame.classList.toggle('global-twinkle');
    }

    function toggleSpectral() {
        isSpectralOn = !isSpectralOn;
        document.getElementById('btnSpectral').classList.toggle('active');
        frame.classList.toggle('global-spectral');
    }

    async function toggleAudio() {
        isAudioOn = !isAudioOn;
        const btn = document.getElementById('btnMic');
        if (isAudioOn) {
            btn.classList.add('active'); 
            frame.classList.add('global-audio'); 
            try {
                if (!audioCtx) {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioCtx.createAnalyser(); audioSource = audioCtx.createMediaStreamSource(stream);
                    audioSource.connect(analyser); analyser.fftSize = 64; dataArray = new Uint8Array(analyser.frequencyBinCount);
                }
                if(audioCtx.state === 'suspended') audioCtx.resume();
                renderAudio();
            } catch(err) { alert("Mic access denied. If testing locally, open via Live Server (HTTP)."); toggleAudio(); }
        } else {
            btn.classList.remove('active');
            frame.classList.remove('global-audio');
            if (audioAnimId) cancelAnimationFrame(audioAnimId);
            document.querySelectorAll('.major-star, .bg-star').forEach(star => { 
                star.style.opacity = ''; 
                star.setAttribute('r', star.getAttribute('data-orig-r')); 
            });
        }
        updateHardwareList();
    }

    function renderAudio() {
        if (!isAudioOn || currentMode === 0) return;
        audioAnimId = requestAnimationFrame(renderAudio);
        analyser.getByteFrequencyData(dataArray);
        
        const stars = document.querySelectorAll('.major-star, .bg-star');
        let j = 0;
        stars.forEach((star) => {
            let val = (dataArray[j] / 255) * 1.5;
            if (val > 1) val = 1;
            let origR = parseFloat(star.getAttribute('data-orig-r'));
            star.style.opacity = 0.3 + (val * 0.7);
            let boost = star.classList.contains('bg-star') ? 1.5 : 3.5;
            star.setAttribute('r', origR + (val * boost)); 
            j = (j + 1) % dataArray.length;
        });
    }

    async function toggleCamera() {
        isCameraOn = !isCameraOn;
        const btn = document.getElementById('btnCamera');
        if (isCameraOn) {
            btn.classList.add('active'); frame.classList.add('global-camera'); camSlider.style.display = 'flex';
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ video: true });
                videoElement.srcObject = videoStream;
                updateCameraOpacity(sliderInput.value);
            } catch(err) { alert("Camera access denied."); toggleCamera(); }
        } else {
            btn.classList.remove('active'); frame.classList.remove('global-camera'); camSlider.style.display = 'none';
            if (videoStream) { videoStream.getTracks().forEach(t => t.stop()); videoElement.srcObject = null; }
        }
        updateHardwareList();
    }

    function updateCameraOpacity(val) {
        videoElement.style.opacity = val;
        document.getElementById('brightnessVal').innerText = Math.round(val * 100) + "%";
    }

    function clearAllConstellations() {
        constellations.forEach(id => {
            const group = document.getElementById(id);
            const btn = document.getElementById('btn-' + id);
            if (activeTimers[id]) { activeTimers[id].forEach(timer => clearTimeout(timer)); }
            group.classList.remove('active-stars', 'active-lines');
            group.querySelectorAll('.major-star').forEach(s => s.classList.remove('active-single-star'));
            if(btn) { btn.classList.remove('active'); btn.querySelector('span').innerText = '+'; }
        });
    }

    function toggleGroup(id, forceState = null) {
        const group = document.getElementById(id);
        const btn = document.getElementById('btn-' + id);
        const stars = group.querySelectorAll('.major-star');
        const isActive = group.classList.contains('active-stars') || group.querySelectorAll('.active-single-star').length > 0;
        
        let targetState = forceState !== null ? forceState : !isActive;
        const currentMode = document.querySelector('input[name="trace"]:checked').value;
        
        if (activeTimers[id]) { activeTimers[id].forEach(timer => clearTimeout(timer)); }
        activeTimers[id] = [];
        
        if (!targetState) {
            group.classList.remove('active-stars', 'active-lines');
            stars.forEach(s => s.classList.remove('active-single-star'));
            if(btn) { btn.classList.remove('active'); btn.querySelector('span').innerText = '+'; }
        } else {
            if(btn) { btn.classList.add('active'); btn.querySelector('span').innerText = '−'; }
            if (currentMode === 'instant') {
                group.classList.add('active-stars', 'active-lines');
            } else if (currentMode === 'sequential') {
                group.classList.add('active-stars');
                activeTimers[id].push(setTimeout(() => group.classList.add('active-lines'), 900));
            } else if (currentMode === 'path') {
                let delay = 300;
                stars.forEach((star, index) => {
                    activeTimers[id].push(setTimeout(() => star.classList.add('active-single-star'), index * delay));
                });
                activeTimers[id].push(setTimeout(() => group.classList.add('active-lines'), (stars.length * delay) + 200));
            }
        }
    }

    function toggleAllTracing() {
        // Check if all are currently active to determine toggle direction
        let allActive = true;
        constellations.forEach(id => {
            const group = document.getElementById(id);
            if (!group.classList.contains('active-stars') && group.querySelectorAll('.active-single-star').length === 0) {
                allActive = false;
            }
        });
        
        let targetState = !allActive; // Turn all ON if any are missing. Otherwise, turn all OFF.
        constellations.forEach(id => toggleGroup(id, targetState));
    }

    function startAutoCycle() {
        let index = 0;
        document.querySelector('input[value="path"]').checked = true;
        function cycleNext() {
            clearAllConstellations();
            toggleGroup(constellations[index]);
            index = (index + 1) % constellations.length;
        }
        cycleNext();
        autoCycleInterval = setInterval(cycleNext, 4000);
    }

    function resetSystem() {
        clearInterval(danceInterval); clearTimeout(motionTimeout); clearInterval(autoCycleInterval);
        tracingBox.style.display = 'none';
        frame.className = 'mirror-frame';
        if(isTwinkleOn) frame.classList.add('global-twinkle');
        if(isAudioOn) frame.classList.add('global-audio');
        if(isCameraOn) frame.classList.add('global-camera');
        if(isSpectralOn) frame.classList.add('global-spectral');
        
        shadow.style.animation = 'none';
        clearAllConstellations();
        document.querySelectorAll('.major-star, .bg-star').forEach(s => { s.classList.remove('dance-active', 'wave-hit', 'shock-hit'); });
        for(let i=0; i<=9; i++) document.getElementById(`btn${i}`).classList.remove('active');
    }

    function switchMode(modeNum) {
        resetSystem(); currentMode = modeNum; updateHardwareList();
        document.getElementById(`btn${modeNum}`).classList.add('active');
        infoPanel.innerHTML = descriptions[modeNum];
        
        if (modeNum === 0) { espLed.className = 'status-led'; return; }
        espLed.className = 'status-led running';
        
        if (modeNum === 4) { 
            espLed.className = 'status-led standby';
            frame.classList.add('camera-standby'); 
            setTimeout(() => { shadow.style.animation = "walkPass 3.5s linear forwards"; }, 100);
            motionTimeout = setTimeout(() => { 
                espLed.className = 'status-led running'; 
                frame.classList.remove('camera-standby');
                // Passive Ambient Reveal
                frame.classList.add('global-twinkle', 'mode-breathe');
                document.getElementById('btnTwinkle').classList.add('active');
                isTwinkleOn = true;
            }, 1500);
            return;
        }

        if (modeNum === 1) { frame.classList.add('mode-rgb'); constellations.forEach(id => document.getElementById(id).classList.add('active-stars')); }
        else if (modeNum === 2) { tracingBox.style.display = 'block'; }
        else if (modeNum === 3) {
            const stars = document.querySelectorAll('.major-star');
            danceInterval = setInterval(() => { stars.forEach(star => { Math.random() > 0.85 ? star.classList.add('dance-active') : star.classList.remove('dance-active'); }); }, 180);
        }
        else if (modeNum === 5) { startAutoCycle(); }
        else if (modeNum === 6) { frame.classList.add('mode-breathe'); constellations.forEach(id => document.getElementById(id).classList.add('active-stars')); }
        else if (modeNum === 7) { frame.classList.add('mode-nebula'); constellations.forEach(id => document.getElementById(id).classList.add('active-stars', 'active-lines')); }
        else if (modeNum === 8 || modeNum === 9) { frame.classList.add('interactive'); constellations.forEach(id => document.getElementById(id).classList.add('active-stars')); }
    }

    // --- INTERACTIVE PIEZO SENSORS ---
    function processImpact(clientX, clientY) {
        if (currentMode !== 8 && currentMode !== 9) return;
        
        const rect = frame.getBoundingClientRect();
        const scaleX = 420 / rect.width;
        const scaleY = 600 / rect.height;
        const clickX = (clientX - rect.left) * scaleX;
        const clickY = (clientY - rect.top) * scaleY;

        document.querySelectorAll('.major-star, .bg-star').forEach(star => {
            const starX = parseFloat(star.getAttribute('cx'));
            const starY = parseFloat(star.getAttribute('cy'));
            const dist = Math.sqrt(Math.pow(clickX - starX, 2) + Math.pow(clickY - starY, 2));

            if (currentMode === 8) {
                setTimeout(() => {
                    star.classList.add('wave-hit');
                    setTimeout(() => star.classList.remove('wave-hit'), 600); 
                }, dist * 2.5);
            } 
            else if (currentMode === 9) {
                const flickerDuration = Math.max(100, 1000 - (dist * 2.5));
                if (flickerDuration > 100) {
                    setTimeout(() => {
                        star.classList.add('shock-hit');
                        setTimeout(() => star.classList.remove('shock-hit'), flickerDuration);
                    }, dist * 0.5);
                }
            }
        });
    }

    function handleMirrorClick(e) { processImpact(e.clientX, e.clientY); }
    function handleMirrorTouch(e) {
        if (currentMode === 8 || currentMode === 9) e.preventDefault(); 
        processImpact(e.touches[0].clientX, e.touches[0].clientY);
    }

    // --- CAPTURE & GIF ENGINE ---
    function takeSnapshot() {
        const mirrorEl = document.getElementById('mirrorFrame');
        const videoEl = document.getElementById('webcamFeed');
        const originalTransition = mirrorEl.style.transition;
        mirrorEl.style.transition = 'none';

        let tempCanvas = null;
        if (isCameraOn && videoEl.readyState >= 2 && !mirrorEl.classList.contains('camera-standby')) {
            tempCanvas = document.createElement('canvas'); tempCanvas.width = 420; tempCanvas.height = 600;
            tempCanvas.style.position = 'absolute'; tempCanvas.style.top = '0'; tempCanvas.style.left = '0'; tempCanvas.style.zIndex = '1';
            tempCanvas.style.opacity = sliderInput.value;
            const ctx = tempCanvas.getContext('2d');
            const vW = videoEl.videoWidth, vH = videoEl.videoHeight, cW = 420, cH = 600;
            let sW = vW, sH = vH, sx = 0, sy = 0;
            if (vW/vH > cW/cH) { sW = vH * (cW/cH); sx = (vW - sW) / 2; } else { sH = vW / (cW/cH); sy = (vH - sH) / 2; }
            ctx.translate(cW, 0); ctx.scale(-1, 1);
            ctx.drawImage(videoEl, sx, sy, sW, sH, 0, 0, cW, cH);
            videoEl.style.display = 'none'; mirrorEl.insertBefore(tempCanvas, mirrorEl.firstChild);
        }

        html2canvas(mirrorEl, { backgroundColor: null, scale: 2, logging: false, useCORS: true }).then(canvas => {
            if (tempCanvas) { tempCanvas.remove(); videoEl.style.display = ''; }
            mirrorEl.style.transition = originalTransition;
            const link = document.createElement('a');
            link.download = 'smart_mirror_os.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    }

    async function recordGIF() {
        const btn = document.getElementById('btnRecord');
        const mirrorEl = document.getElementById('mirrorFrame');
        const videoEl = document.getElementById('webcamFeed');
        btn.innerText = "⏳ Recording... (Hold still!)"; btn.style.pointerEvents = "none"; btn.style.background = "#555";

        let tempCanvas = null, ctx = null;
        if (isCameraOn && videoEl.readyState >= 2 && !mirrorEl.classList.contains('camera-standby')) {
            tempCanvas = document.createElement('canvas'); tempCanvas.width = 420; tempCanvas.height = 600;
            tempCanvas.style.position = 'absolute'; tempCanvas.style.top = '0'; tempCanvas.style.left = '0'; tempCanvas.style.zIndex = '1';
            tempCanvas.style.opacity = sliderInput.value;
            ctx = tempCanvas.getContext('2d');
            videoEl.style.display = 'none'; mirrorEl.insertBefore(tempCanvas, mirrorEl.firstChild);
        }

        const frames = []; const totalFrames = 30; 
        for (let i = 0; i < totalFrames; i++) {
            if (tempCanvas) {
                const vW = videoEl.videoWidth, vH = videoEl.videoHeight, cW = 420, cH = 600;
                let sW = vW, sH = vH, sx = 0, sy = 0;
                if (vW/vH > cW/cH) { sW = vH * (cW/cH); sx = (vW - sW) / 2; } else { sH = vW / (cW/cH); sy = (vH - sH) / 2; }
                ctx.clearRect(0,0,cW,cH); ctx.save(); ctx.translate(cW, 0); ctx.scale(-1, 1);
                ctx.drawImage(videoEl, sx, sy, sW, sH, 0, 0, cW, cH); ctx.restore();
            }
            const canvas = await html2canvas(mirrorEl, { backgroundColor: null, scale: 1, logging: false, useCORS: true });
            frames.push(canvas.toDataURL('image/png'));
            await new Promise(r => setTimeout(r, 66));
        }

        if (tempCanvas) { tempCanvas.remove(); videoEl.style.display = ''; }
        btn.innerText = "⚙️ Stitching 30 Frames...";

        gifshot.createGIF({ images: frames, gifWidth: 420, gifHeight: 600, interval: 0.066, numWorkers: 2 }, function(obj) {
            if(!obj.error) {
                const link = document.createElement('a');
                link.download = 'smart_mirror_os.gif'; link.href = obj.image; link.click();
            }
            btn.innerText = "🔴 Record GIF"; btn.style.pointerEvents = "auto"; btn.style.background = "#8a2be2";
        });
    }
</script>
